# Generated by Claude Sonnet 5
name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, rather
      # than quietly resolving something the lockfile does not describe.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci rather than install, so the lockfile is what gets built.
      - run: npm ci

      - run: npm test

      - run: npm run build
