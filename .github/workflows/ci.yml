# Generated by Claude Sonnet 5
name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, rather
      # than quietly resolving something the lockfile does not describe.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest
