display_name = "Saarbrücken"

osm_query = "Saarbrücken, Germany"

# IANA zone. The slider reads local wall-clock time; the solar oracle wants
# UTC, and only a named zone gets the offset and its DST right.
timezone = "Europe/Berlin"

[center]
lon = 7.0000 
lat = 49.2326

# Optional. Asserted against estimate_utm_crs() so a wrong projection cannot
# reach the geometry stage. Omit it and the zone is derived from the centre.
[crs]
expected_utm_epsg = 32632  # UTM zone 32N
