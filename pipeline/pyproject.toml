# I used Claude Sonnet 5 for generating quite a few stuff here
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "tenshadows"
version = "0.1.0"
description = "Shadow-aware pedestrian routing"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Stochastic Batman" }]


dependencies = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "suncalc>=0.1.3",
    "numpy>=1.26",
    "typer>=0.12",
]


# PEP 735 groups rather than optional-dependencies: `uv sync` installs the dev
# group automatically, so there is no extra to remember. These are development
# tools, not features of the package, which is what the distinction is for.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]


[project.scripts]
tenshadows = "tenshadows.cli:app"

[project.urls]
Repository = "https://github.com/Stochastic-Batman/TenShadows"


[tool.hatch.build.targets.wheel]
packages = ["tenshadows"]


# The pipeline is an application we run, not a library we publish, so the
# resolved versions are pinned in uv.lock and that file is committed. A city
# build should be reproducible: OSM data drifts on its own, so the toolchain
# should not add a second source of drift.
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
lines-after-imports = 2
